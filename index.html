<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QA Job Radar · Maxi</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:#0d0d0f;color:#f0f0f0;font-family:'Syne',sans-serif;min-height:100vh;padding-bottom:60px}
    ::-webkit-scrollbar{width:6px}
    ::-webkit-scrollbar-track{background:#0d0d0f}
    ::-webkit-scrollbar-thumb{background:#222;border-radius:3px}
    input::placeholder{color:#333}
    select option{background:#1a1a1c;color:#888}
    a{text-decoration:none}
    .btn{border:none;font-family:'Syne',sans-serif;font-weight:700;cursor:pointer;border-radius:8px;transition:opacity 0.15s}
    .btn:hover{opacity:0.85}
    .card{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:13px 16px;cursor:pointer;margin-bottom:7px;transition:border-color 0.2s,background 0.2s}
    .card:hover{background:rgba(255,255,255,0.03)}
    .tag{font-size:9px;padding:1px 6px;border-radius:10px;background:rgba(255,255,255,0.04);color:#777;border:1px solid rgba(255,255,255,0.07)}
    .pulse{animation:pulse 2s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
  </style>
</head>
<body>
<div id="app">
  <div style="text-align:center;padding:80px 20px;color:#2a2a2a">
    <div style="font-size:28px;margin-bottom:12px" class="pulse">⟳</div>
    <div style="font-size:12px">Cargando ofertas...</div>
  </div>
</div>

<script>
// ─── CONFIG — cambiá esto con tu usuario y repo de GitHub ─────────────────────
// Una vez que subas el repo, reemplazá con la URL raw de tu jobs.json:
// https://raw.githubusercontent.com/TU_USUARIO/TU_REPO/main/data/jobs.json
const JOBS_URL = "https://raw.githubusercontent.com/Eikasia369/qa-job-agent/main/data/jobs.json";

// ─── Colores por fuente ───────────────────────────────────────────────────────
const SRC_COLOR = {
  Remotive:"#00b894", WorkingNomads:"#fd79a8", GetOnBoard:"#e17055",
  Jobicy:"#6c5ce7", Himalayas:"#00cec9", LinkedIn:"#4a9eed", Hitmarker:"#a8e063"
};
const VC = {
  excelente:{label:"Excelente",color:"#00b894",bg:"rgba(0,184,148,0.10)"},
  bueno:    {label:"Buen match",color:"#fdcb6e",bg:"rgba(253,203,110,0.10)"},
  regular:  {label:"Regular",   color:"#a29bfe",bg:"rgba(162,155,254,0.10)"},
  bajo:     {label:"Bajo",      color:"#555",   bg:"rgba(255,255,255,0.03)"},
};

// ─── State ────────────────────────────────────────────────────────────────────
let allJobs = [], filteredJobs = [];
let meta = {};
let filter = "todos", sourceFilter = "todos", sortBy = "score", search = "";
let expandedId = null;
let showOnlyNew = false;

// ─── Fetch data ───────────────────────────────────────────────────────────────
async function loadJobs() {
  try {
    const cachebust = `?t=${Date.now()}`;
    const res = await fetch(JOBS_URL + cachebust);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    meta = {
      lastUpdated: data.last_updated,
      totalFetched: data.total_fetched,
      sources: data.sources || {},
      newCount: data.new_count || 0,
      newIds: new Set((data.new_jobs || []).map(j => j.id)),
    };
    allJobs = data.jobs || [];
    applyFilters();
    render();
  } catch(e) {
    document.getElementById("app").innerHTML = `
      <div style="text-align:center;padding:60px 20px;color:#ff6b6b">
        <div style="font-size:22px;margin-bottom:10px">⚠</div>
        <div style="font-size:13px;margin-bottom:6px">No se pudo cargar jobs.json</div>
        <div style="font-size:11px;color:#444">${e.message}</div>
        <div style="font-size:11px;color:#333;margin-top:10px">
          Verificá que JOBS_URL esté configurado y que el repo sea público.
        </div>
      </div>`;
  }
}

// ─── Filters ──────────────────────────────────────────────────────────────────
function applyFilters() {
  filteredJobs = allJobs
    .filter(j => filter === "todos" || j.verdict === filter)
    .filter(j => sourceFilter === "todos" || j.source === sourceFilter)
    .filter(j => !showOnlyNew || meta.newIds?.has(j.id))
    .filter(j => {
      if (!search) return true;
      const s = search.toLowerCase();
      return (j.title||"").toLowerCase().includes(s) || (j.company||"").toLowerCase().includes(s);
    })
    .sort((a,b) => sortBy === "score" ? b.score - a.score : new Date(b.date||0) - new Date(a.date||0));
}

// ─── Time helper ──────────────────────────────────────────────────────────────
function timeAgo(d) {
  if (!d) return "—";
  const days = Math.floor((Date.now() - new Date(d)) / 86400000);
  if (days === 0) return "hoy"; if (days === 1) return "ayer";
  if (days < 7) return `${days}d`; if (days < 30) return `${Math.floor(days/7)}sem`;
  return `${Math.floor(days/30)}m`;
}

function fmtDate(iso) {
  if (!iso) return "—";
  return new Date(iso).toLocaleString("es-AR", {day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
}

// ─── Render helpers ───────────────────────────────────────────────────────────
function scoreBar(score) {
  const c = score>=70?"#00b894":score>=50?"#fdcb6e":score>=25?"#a29bfe":"#555";
  return `<div style="display:flex;align-items:center;gap:7px">
    <div style="flex:1;height:4px;background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden">
      <div style="width:${score}%;height:100%;background:${c};border-radius:2px"></div>
    </div>
    <span style="color:${c};font-weight:700;font-size:11px;min-width:24px">${score}</span>
  </div>`;
}

function jobCard(job) {
  const vc = VC[job.verdict] || VC.bajo;
  const sc = SRC_COLOR[job.source] || "#888";
  const isNew = meta.newIds?.has(job.id);
  const isExpanded = expandedId === job.id;
  const matches = (job.matches||[]).map(m => `<span class="tag">${m}</span>`).join("");
  const warnings = (job.warnings||[]).map(w => `<span style="font-size:9px;padding:1px 6px;border-radius:10px;background:rgba(255,107,107,0.08);color:#ff6b6b;border:1px solid rgba(255,107,107,0.15)">⚠ ${w}</span>`).join("");

  const expanded = isExpanded ? `
    <div style="margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,0.06)">
      <p style="font-size:12px;color:#666;line-height:1.75;margin:0 0 12px">
        ${(job.description||"Sin descripción.").slice(0,500)}${(job.description||"").length>500?"...":""}
      </p>
      ${job.url
        ? `<a href="${job.url}" target="_blank" onclick="event.stopPropagation()"
            style="display:inline-block;padding:7px 15px;border-radius:7px;background:${vc.color};color:#000;font-size:11px;font-weight:700">Ver oferta →</a>`
        : `<span style="font-size:11px;color:#444">Sin URL directa</span>`}
    </div>` : "";

  return `<div class="card" id="job-${job.id}"
    style="${isExpanded ? `border-color:${vc.color}55;background:rgba(255,255,255,0.04)` : ""}"
    onclick="toggleExpand('${job.id}')">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
      <div style="flex:1;min-width:0">
        <div style="display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-bottom:5px">
          ${isNew ? `<span style="font-size:9px;font-weight:700;padding:2px 7px;border-radius:20px;background:rgba(253,203,110,0.15);color:#fdcb6e">✦ NUEVA</span>` : ""}
          <span style="font-size:9px;font-weight:700;color:${vc.color};background:${vc.bg};padding:2px 7px;border-radius:20px">${vc.label}</span>
          <span style="font-size:9px;font-weight:700;padding:2px 7px;border-radius:20px;background:${sc}18;color:${sc}">${job.source}</span>
          ${job.salary ? `<span style="font-size:9px;color:#00cec9;background:rgba(0,206,201,0.08);padding:2px 7px;border-radius:20px">💰 ${job.salary}</span>` : ""}
          <span style="font-size:9px;color:#444">${timeAgo(job.date)}</span>
        </div>
        <div style="font-family:'DM Serif Display',serif;font-size:15px;color:#eee;line-height:1.3;margin-bottom:2px">${job.title||""}</div>
        <div style="font-size:11px;color:#666">${job.company||""}${job.location&&job.location!=="—"?` · ${job.location}`:""}</div>
      </div>
      <div style="flex-shrink:0;width:90px;padding-top:2px">${scoreBar(job.score||0)}</div>
    </div>
    ${matches||warnings ? `<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:4px">${matches}${warnings}</div>` : ""}
    ${expanded}
  </div>`;
}

// ─── Main render ──────────────────────────────────────────────────────────────
function render() {
  const stats = {
    total: allJobs.length,
    excelente: allJobs.filter(j=>j.verdict==="excelente").length,
    bueno: allJobs.filter(j=>j.verdict==="bueno").length,
    nuevas: meta.newCount || 0,
  };

  const sources = Object.entries(meta.sources||{});
  const sourcePills = sources.map(([k,v]) =>
    `<span style="font-size:10px;padding:3px 9px;border-radius:20px;border:1px solid ${SRC_COLOR[k]||"#555"}30;color:${SRC_COLOR[k]||"#555"}99;background:${SRC_COLOR[k]||"#555"}08">${k}: ${v}</span>`
  ).join("");

  const filterBtns = ["todos","excelente","bueno","regular"].map(f =>
    `<button class="btn" onclick="setFilter('${f}')"
      style="padding:6px 11px;font-size:10px;text-transform:capitalize;
      background:${filter===f?(VC[f]?.color||"rgba(255,255,255,0.15)"):"rgba(255,255,255,0.04)"};
      color:${filter===f?"#000":"#555"}">${f}</button>`
  ).join("");

  const srcBtns = ["todos",...Object.keys(SRC_COLOR)].map(s =>
    `<button class="btn" onclick="setSrcFilter('${s}')"
      style="padding:6px 11px;font-size:10px;
      background:${sourceFilter===s?(SRC_COLOR[s]||"rgba(255,255,255,0.15)"):"rgba(255,255,255,0.04)"};
      color:${sourceFilter===s?"#000":"#555"}">${s==="todos"?"Todos":s}</button>`
  ).join("");

  const jobCards = filteredJobs.map(jobCard).join("") ||
    `<div style="text-align:center;padding:50px;color:#2a2a2a">
      <div style="font-size:24px;margin-bottom:8px">🔍</div>
      <div style="font-size:12px;color:#333">Sin resultados con estos filtros</div>
    </div>`;

  document.getElementById("app").innerHTML = `
    <!-- Header -->
    <div style="border-bottom:1px solid rgba(255,255,255,0.06);padding:20px 24px 16px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px">
      <div>
        <div style="font-size:9px;color:#252525;letter-spacing:3px;margin-bottom:4px">JOB RADAR · QA · AUTO</div>
        <h1 style="font-family:'DM Serif Display',serif;font-size:22px;font-weight:400;color:#eee">Maxi · QA Jobs</h1>
        <div style="margin-top:4px;font-size:10px;color:#333">
          Actualizado: ${fmtDate(meta.lastUpdated)}
          &nbsp;·&nbsp; ${meta.totalFetched||0} revisadas
        </div>
        <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">${sourcePills}</div>
      </div>
      <button class="btn" onclick="loadJobs()"
        style="padding:8px 14px;background:#00b894;color:#000;font-size:11px">
        ↻ Refrescar
      </button>
    </div>

    <div style="max-width:860px;margin:0 auto;padding:0 16px">

      <!-- Stats -->
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px">
        ${[
          {l:"Curadas",   v:stats.total,     c:null},
          {l:"Excelente", v:stats.excelente, c:"#00b894"},
          {l:"Buen match",v:stats.bueno,     c:"#fdcb6e"},
          {l:"✦ Nuevas",  v:stats.nuevas,    c:"#fdcb6e"},
        ].map(s=>`
          <div style="background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.05);border-radius:10px;padding:10px 14px">
            <div style="font-family:'DM Serif Display',serif;font-size:22px;color:${s.c||"#ddd"}">${s.v}</div>
            <div style="font-size:9px;color:#444;margin-top:1px">${s.l}</div>
          </div>`).join("")}
      </div>

      <!-- Filters -->
      <div style="margin-top:12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center">
        <input id="search-input" value="${search}" oninput="setSearch(this.value)"
          placeholder="Buscar título o empresa..."
          style="flex:1;min-width:160px;padding:7px 11px;background:rgba(255,255,255,0.03);
            border:1px solid rgba(255,255,255,0.07);border-radius:8px;color:#f0f0f0;
            font-family:'Syne',sans-serif;font-size:11px;outline:none"/>
        ${filterBtns}
        <div style="width:1px;height:16px;background:rgba(255,255,255,0.07)"></div>
        <label style="display:flex;align-items:center;gap:5px;font-size:10px;color:#555;cursor:pointer">
          <input type="checkbox" ${showOnlyNew?"checked":""} onchange="setOnlyNew(this.checked)"
            style="accent-color:#fdcb6e"/> Solo nuevas
        </label>
        <select onchange="setSortBy(this.value)"
          style="padding:6px 9px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);
            border-radius:8px;color:#555;font-family:'Syne',sans-serif;font-size:10px;outline:none">
          <option value="score" ${sortBy==="score"?"selected":""}>Por score</option>
          <option value="date"  ${sortBy==="date" ?"selected":""}>Por fecha</option>
        </select>
      </div>

      <!-- Source filter -->
      <div style="margin-top:6px;display:flex;gap:5px;flex-wrap:wrap">${srcBtns}</div>

      <!-- Results -->
      <div style="margin-top:12px">${jobCards}</div>

      ${filteredJobs.length > 0 ? `
        <div style="text-align:center;margin-top:16px;font-size:10px;color:#222">
          ${filteredJobs.length} de ${allJobs.length} ofertas
        </div>` : ""}
    </div>`;
}

// ─── Event handlers ───────────────────────────────────────────────────────────
function toggleExpand(id) {
  expandedId = expandedId === id ? null : id;
  render();
  if (expandedId) {
    setTimeout(() => document.getElementById(`job-${id}`)?.scrollIntoView({behavior:"smooth",block:"nearest"}), 50);
  }
}
function setFilter(f)    { filter = f; applyFilters(); render(); }
function setSrcFilter(s) { sourceFilter = s; applyFilters(); render(); }
function setSortBy(s)    { sortBy = s; applyFilters(); render(); }
function setOnlyNew(v)   { showOnlyNew = v; applyFilters(); render(); }
function setSearch(v)    { search = v; applyFilters(); render(); }

// ─── Init ─────────────────────────────────────────────────────────────────────
loadJobs();

// Auto-refresh cada 30 minutos
setInterval(loadJobs, 30 * 60 * 1000);
</script>
</body>
</html>
