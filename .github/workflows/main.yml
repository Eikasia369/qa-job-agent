name: QA Job Agent

on:
  schedule:
    # Corre 3 veces por día: 8am, 2pm y 8pm (hora Argentina = UTC-3)
    - cron: "0 11,17,23 * * *"
  workflow_dispatch:   # también permite correrlo a mano desde GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # necesario para hacer commit del jobs.json

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run scraper
        env:
          EMAIL_SENDER:    ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD:  ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: python scraper.py

      - name: Commit jobs.json al repo
        run: |
          git config user.name  "QA Job Agent"
          git config user.email "actions@github.com"
          git add data/jobs.json data/seen_ids.json
          git diff --staged --quiet || git commit -m "chore: update jobs $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
